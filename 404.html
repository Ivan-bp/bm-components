<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BM Components</title>
    <script type="text/javascript">
      // Truco para Single Page Apps en GitHub Pages
      var pathSegmentsToKeep = 1; // 1 porque tu repo es /bm-components/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
